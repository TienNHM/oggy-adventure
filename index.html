<!-- ============================================================================
  index.html — TRANG DUY NHẤT CỦA GAME (khung HTML + thứ tự nạp script)
  ----------------------------------------------------------------------------
  Vai trò:      Dựng khung DOM (canvas, HUD, nút cảm ứng, lớp panel) và nạp ~70 file JS theo một thứ tự
                cố định. Mở thẳng file này bằng trình duyệt (file://) là chơi được, không cần server hay build.
  Khái niệm:    thứ tự nạp script = thứ tự phụ thuộc · module pattern IIFE gắn vào window.OG (không ES modules)
                · canvas kích thước logic cố định 960×540, CSS co giãn theo màn hình · lớp DOM phủ lên canvas
  Bài học:      docs/learn/00-bat-dau.md (chính) · docs/learn/01-module-pattern-iife-namespace.md
                · docs/learn/13-kiem-thu-ci.md (smoke test đọc chính file này)
  Phụ thuộc:    mọi file trong src/, assets/photos/(id)/credits.js, src/ui/ui.css, src/social/social.css,
                src/story/story.css
  Đọc tiếp:     src/core/namespace.js (file nạp đầu tiên) → src/core/main.js (file nạp cuối, khởi động game)
                → docs/ARCHITECTURE.md mục 2 (bảng thứ tự load đầy đủ)

  💡 Khái niệm — vì sao không dùng ES modules (import/export)?
    Trình duyệt chặn import module khi trang mở qua file:// (lỗi CORS). Thay vào đó mỗi file là một IIFE
    (hàm tự gọi) gắn module vào biến toàn cục window.OG. Đánh đổi: trình duyệt KHÔNG tự sắp thứ tự phụ thuộc
    như import — ta phải tự xếp các thẻ script bên dưới: file nào đọc OG.X lúc nạp thì phải đứng SAU file tạo OG.X.

  ⚠️ Bẫy (smoke test đọc file này bằng regex — tests/smoke.js):
    - Mỗi script phải viết đúng dạng một dòng: thẻ script, thuộc tính src trong nháy kép, không defer/async/type.
      Viết khác đi thì test BỎ QUA file đó (game thật vẫn chạy) → lỗi trong file đó không bị bắt.
    - Không chép nguyên văn thẻ script vào comment: regex không phân biệt comment, sẽ cố nạp đường dẫn đó.
    - Test cũng quét file này tìm tên font cấm (kể cả trong comment) và kiểm tra file CSS ở thẻ link tồn tại.
    - File public MỚI (ngoài src/, docs/, assets/) phải thêm vào bước "Đóng gói site" của .github/workflows/pages.yml.
  ============================================================================ -->
<style>
/* CSS lõi tối thiểu cho khung game. Style riêng của từng module nằm ở các file .css nạp ngay sau khối này. */
:root{--ink:#17233d;--cream:#fff6df;--gold:#ffc94a;--blue:#52c5ee;--orange:#f27a43;--secondary:#52b9df}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10192b;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:white}
#wrap{height:100%;display:grid;place-items:center;padding:12px}
/* Khung luôn giữ tỉ lệ 16:9 và vừa CẢ chiều rộng lẫn chiều cao cửa sổ (min của 3 giới hạn) — không bị cắt. */
#gameShell{width:min(1100px,100%,calc((100vh - 24px) * 16 / 9));position:relative;aspect-ratio:16/9;max-height:calc(100vh - 24px);border:5px solid #fff0c9;border-radius:20px;overflow:hidden;box-shadow:0 18px 60px #0009;background:#8adcf4}
/* touch-action:none: chạm trên canvas không cuộn/phóng to trang, để OG.Input nhận trọn cử chỉ. */
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;pointer-events:none;text-shadow:0 2px 3px #26334c}
.pill{background:#17233ddd;border:2px solid #fff4d6;border-radius:99px;padding:7px 13px;font-weight:900;font-size:clamp(13px,1.8vw,19px)}
#hudLeft,#hudRight{display:flex;gap:8px;align-items:center}
#pauseBtn{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:56px;height:56px;padding:0;border-radius:18px;background:#17233dbb;border:3px solid #fff;font-size:26px;box-shadow:0 4px 0 #080e1c88}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#15213b88,#15213bcc);padding:18px;overflow:auto}
.panel{width:min(520px,94%);background:#fff6df;color:#25314a;border:5px solid #fff;border-radius:24px;padding:clamp(18px,3vw,30px);text-align:center;box-shadow:0 12px 0 #b87542}
.panel h1{font-size:clamp(27px,5vw,48px);margin:0 0 8px;color:#ed713c;text-shadow:2px 3px #ffd36b}
.panel p{line-height:1.5;margin:8px 0 18px;font-weight:700}
button{border:0;border-radius:14px;padding:12px 20px;background:#f27a43;color:white;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #b74b2b;font-family:inherit}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b74b2b}
#pauseBtn:active{transform:translateX(-50%) translateY(2px)}
.secondary{background:#52b9df;box-shadow:0 5px 0 #2582aa}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:#17233ddd;border:2px solid white;border-radius:14px;padding:10px 16px;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;z-index:5}
#mobileControls{position:absolute;bottom:12px;left:12px;right:12px;display:none;justify-content:space-between;pointer-events:none}
.pad{display:flex;gap:16px}
/* Nút cảm ứng to cho tay trẻ em (≥ 74px, xem OG.Input.TOUCH_SIZE) */
.touch{pointer-events:auto;width:74px;height:74px;padding:0;border-radius:22px;background:#17233dbb;border:3px solid #fff;color:white;font-size:32px;box-shadow:0 4px 0 #080e1c88;touch-action:none;user-select:none;-webkit-user-select:none}
.touch.held{background:#f27a43cc}
@media(pointer:coarse),(max-width:700px){#mobileControls{display:flex}#gameShell{border-width:3px;border-radius:12px}#hud{padding:7px}.pill{padding:5px 8px}}
/* Điện thoại dựng đứng: khung 16:9 rất nhỏ → gợi ý xoay ngang (game vẫn chơi được). */
@media(orientation:portrait) and (max-width:700px){#wrap{align-content:center;gap:14px}#wrap::after{content:"📱 Xoay ngang điện thoại để chơi dễ hơn";font-weight:800;font-size:14px;opacity:.85;text-align:center}}
#gameShell.touch-on #mobileControls{display:flex}
#gameShell.touch-off #mobileControls,#mobileControls.hidden{display:none!important}
.small{font-size:12px;opacity:.8}
.hidden{display:none!important}
</style>

<body>
<div id="wrap"><div id="gameShell">
  <!-- 💡 Khái niệm: width/height = kích thước LOGIC (toạ độ vẽ 960×540, OG.W × OG.H); CSS phóng to/thu nhỏ
       khi hiển thị. Code game luôn vẽ theo 960×540 bất kể màn hình thật to hay nhỏ.
       Các phần tử DOM bên dưới nằm ĐÈ lên canvas (position:absolute) — chữ và nút sắc nét, dễ bấm. -->
  <canvas id="game" width="960" height="540" aria-label="Oggy Adventure game"></canvas>
  <!-- HUD mặc định: OG.Menus.updateHud() cập nhật; nhóm UI được thay nội dung bên trong #hud -->
  <div id="hud">
    <div id="hudLeft"><div class="pill" id="level">🏡 Nhà Oggy</div><div class="pill" id="objective">🍕 0/5</div></div>
    <div id="hudRight"><div class="pill" id="coins">🪙 0</div><div class="pill" id="lives">❤️❤️❤️</div><div class="pill" id="score">⭐ 0</div></div>
  </div>
  <button id="pauseBtn" type="button" aria-label="Tạm dừng" style="display:none">⏸</button>
  <div id="toast"></div>
  <!-- Nút cảm ứng: data-key là PHÍM LOGIC (left/right/jump/action) mà OG.Input giữ khi chạm, giống bàn phím. -->
  <div id="mobileControls">
    <div class="pad"><button class="touch" data-key="left" aria-label="Trái">◀</button><button class="touch" data-key="right" aria-label="Phải">▶</button></div>
    <div class="pad"><button class="touch" data-key="action" aria-label="Tương tác">✦</button><button class="touch" data-key="jump" aria-label="Nhảy">⬆</button></div>
  </div>
  <!-- Lớp panel (menu, tạm dừng, kết quả...) do OG.DOM.panel() điều khiển -->
  <div id="overlay" style="display:none"></div>
</div></div>

<!-- ===== THỨ TỰ LOAD SCRIPT (không dùng ES modules để chạy được qua file://) =====
     Quy tắc: tầng dưới trước, tầng trên sau — core → dữ liệu → đồ hoạ/âm thanh → gameplay → tính năng → nội dung
     → khởi động. Trong lúc NẠP, mỗi file chỉ đăng ký (gắn OG.X, registerType, register...); việc thật sự
     (tạo DOM, nghe event, đọc save) chờ tới init() do main.js gọi, khi MỌI file đã có mặt.
     Đặt script ở cuối trang: lúc chạy, các phần tử phía trên (canvas, #hud...) đã có trong DOM.
     Sinh viên nên đọc code theo đúng thứ tự này.
     "Nhóm phụ trách" trong tiêu đề mỗi nhóm: dự án được viết song song bởi nhiều nhóm, mỗi nhóm chỉ sửa thư mục của mình.
     Nhóm Tích hợp ghép các phần lại (sửa file này, src/core/, src/game/). Việc một nhóm cần nhóm khác làm hộ được ghi
     trong src/(thư mục)/INTEGRATION.md — xem docs/learn/00-bat-dau.md, bảng thư mục. -->
