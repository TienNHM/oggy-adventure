<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#17233d">
<title>Oggy Adventure — Browser Game</title>
<!-- Chủ sở hữu file này: agent Tích hợp. Kiến trúc & hợp đồng: docs/ARCHITECTURE.md -->
<style>
:root{--ink:#17233d;--cream:#fff6df;--gold:#ffc94a;--blue:#52c5ee;--orange:#f27a43;--secondary:#52b9df}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10192b;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:white}
#wrap{height:100%;display:grid;place-items:center;padding:12px}
#gameShell{width:min(1100px,100%);position:relative;aspect-ratio:16/9;max-height:calc(100vh - 24px);border:5px solid #fff0c9;border-radius:20px;overflow:hidden;box-shadow:0 18px 60px #0009;background:#8adcf4}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;pointer-events:none;text-shadow:0 2px 3px #26334c}
.pill{background:#17233ddd;border:2px solid #fff4d6;border-radius:99px;padding:7px 12px;font-weight:900;font-size:clamp(11px,1.5vw,16px)}
#hudLeft,#hudRight{display:flex;gap:8px;align-items:center}
#pauseBtn{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:40px;height:40px;padding:0;border-radius:12px;background:#17233dbb;border:2px solid #fff;font-size:18px;box-shadow:0 3px 0 #080e1c88}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(#15213b88,#15213bcc);padding:18px;overflow:auto}
.panel{width:min(520px,94%);background:#fff6df;color:#25314a;border:5px solid #fff;border-radius:24px;padding:clamp(18px,3vw,30px);text-align:center;box-shadow:0 12px 0 #b87542}
.panel h1{font-size:clamp(27px,5vw,48px);margin:0 0 8px;color:#ed713c;text-shadow:2px 3px #ffd36b}
.panel p{line-height:1.5;margin:8px 0 18px;font-weight:700}
button{border:0;border-radius:14px;padding:12px 20px;background:#f27a43;color:white;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #b74b2b;font-family:inherit}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b74b2b}
#pauseBtn:active{transform:translateX(-50%) translateY(2px)}
.secondary{background:#52b9df;box-shadow:0 5px 0 #2582aa}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:#17233ddd;border:2px solid white;border-radius:14px;padding:10px 16px;font-weight:900;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;z-index:5}
#mobileControls{position:absolute;bottom:12px;left:12px;right:12px;display:none;justify-content:space-between;pointer-events:none}
.pad{display:flex;gap:10px}
.touch{pointer-events:auto;width:58px;height:58px;padding:0;border-radius:18px;background:#17233dbb;border:2px solid #fff;color:white;font-size:25px;box-shadow:0 4px 0 #080e1c88;touch-action:none;user-select:none;-webkit-user-select:none}
.touch.held{background:#f27a43cc}
@media(pointer:coarse),(max-width:700px){#mobileControls{display:flex}#gameShell{border-width:3px;border-radius:12px}#hud{padding:7px}.pill{padding:5px 8px}}
#gameShell.touch-on #mobileControls{display:flex}
#gameShell.touch-off #mobileControls,#mobileControls.hidden{display:none!important}
.small{font-size:12px;opacity:.8}
.hidden{display:none!important}
</style>
<!-- Style của module tính năng (load sau để có thể ghi đè) -->
<link rel="stylesheet" href="src/ui/ui.css">
<link rel="stylesheet" href="src/social/social.css">
</head>
<body>
<div id="wrap"><div id="gameShell">
  <canvas id="game" width="960" height="540" aria-label="Oggy Adventure game"></canvas>
  <!-- HUD mặc định: OG.Menus.updateHud() cập nhật; agent UI được thay nội dung bên trong #hud -->
  <div id="hud">
    <div id="hudLeft"><div class="pill" id="level">🏡 Nhà Oggy</div><div class="pill" id="objective">🍕 0/5</div></div>
    <div id="hudRight"><div class="pill" id="coins">🪙 0</div><div class="pill" id="lives">❤️❤️❤️</div><div class="pill" id="score">⭐ 0</div></div>
  </div>
  <button id="pauseBtn" type="button" aria-label="Tạm dừng" style="display:none">⏸</button>
  <div id="toast"></div>
  <div id="mobileControls">
    <div class="pad"><button class="touch" data-key="left" aria-label="Trái">◀</button><button class="touch" data-key="right" aria-label="Phải">▶</button></div>
    <div class="pad"><button class="touch" data-key="action" aria-label="Tương tác">✦</button><button class="touch" data-key="jump" aria-label="Nhảy">⬆</button></div>
  </div>
  <!-- Lớp panel (menu, tạm dừng, kết quả...) do OG.DOM.panel() điều khiển -->
  <div id="overlay" style="display:none"></div>
</div></div>
