# Deploy Oggy Adventure lên GitHub Pages mỗi khi push vào master.
# Chạy smoke test trước; chỉ đóng gói các file game (bỏ tests/, legacy/, tools/).
# Sau đó dựng sẵn (pre-render) trang giáo trình /learn/ từ docs/learn + docs/design bằng tools/learn-site
# (thư viện npm chỉ dùng ở bước build này; game vẫn không có build step).
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Lấy đủ lịch sử git để sitemap ghi đúng ngày sửa (lastmod) của từng bài học.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Smoke test
        run: node tests/smoke.js

      - name: Đóng gói site
        # assets/ = ảnh chụp thẻ kiến thức + credits.js. KHÔNG đóng gói tools/ (công cụ chỉ dùng lúc soạn nội dung).
        run: |
          mkdir _site
          cp -r index.html src docs assets CNAME .nojekyll robots.txt sitemap.xml llms.txt site.webmanifest _site/
          rm -f _site/assets/photos/*/_entries.json

      - name: Kiểm tra link trong giáo trình
        # Link tương đối gãy trong docs/learn/ thì dừng deploy.
        run: node tests/check-doc-links.js

      - name: Cache npm cho trình dựng trang học
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/learn-site/package-lock.json

      - name: Cài thư viện build trang học
        working-directory: tools/learn-site
        run: npm ci --no-audit --no-fund

      - name: Dựng trang học /learn/
        # Tạo _site/learn/... và ghi đè _site/sitemap.xml bằng bản đầy đủ (trang chủ + mọi trang learn).
        # Link tương đối trỏ tới file không tồn tại → build thoát mã 1 → không deploy.
        working-directory: tools/learn-site
        # Sau khi dựng HTML, bỏ bản Markdown thô (docs/learn, docs/design) khỏi gói deploy:
        # nếu không, Google thấy cùng một nội dung ở 2 URL (/learn/... và /docs/learn/...md) → trùng lặp.
        # Bản .md vẫn đọc được trên GitHub; ảnh/SVG cần cho trang đã được build.mjs copy sang _site/learn/.
        run: |
          node build.mjs --out ../../_site
          rm -rf ../../_site/docs/learn ../../_site/docs/design
          node check-site.mjs ../../_site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
