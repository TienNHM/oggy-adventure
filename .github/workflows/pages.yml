# Deploy Oggy Adventure lên GitHub Pages mỗi khi push vào master.
# Chạy smoke test trước; chỉ đóng gói các file game (bỏ tests/, legacy/).
name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Smoke test
        run: node tests/smoke.js

      - name: Đóng gói site
        run: |
          mkdir _site
          cp -r index.html src docs CNAME .nojekyll robots.txt sitemap.xml llms.txt site.webmanifest _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
